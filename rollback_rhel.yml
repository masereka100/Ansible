- name: Rollback RHEL system packages to last snapshot
  hosts: all
  become: yes
  vars:
    backup_dir: /var/backups

  tasks:

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure snapshot directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory

    - name: Find the latest RPM snapshot file
      find:
        paths: "{{ backup_dir }}"
        patterns: "rpm-snapshot-{{ inventory_hostname }}-*.txt"
        recurse: no
        age: 0
        age_stamp: mtime
        sort: time
      register: snapshot_file

    - name: Fail if no snapshot exists
      fail:
        msg: "No RPM snapshot found for {{ inventory_hostname }}"
      when: snapshot_file.matched == 0

    - name: Read snapshot file
      slurp:
        src: "{{ snapshot_file.files[0].path }}"
      register: snapshot_content

    - name: Restore packages to versions from snapshot
      dnf:
        name: "{{ snapshot_content.content | b64decode | splitlines() }}"
        state: present
      register: rollback_result

    - name: Show rollback result
      debug:
        var: rollback_result

    - name: Log rollback action
      lineinfile:
        path: /var/log/ansible-rollback.log
        line: "Rollback executed on {{ ansible_date_time.date }} {{ ansible_date_time.time }} using snapshot {{ snapshot_file.files[0].path }}"
        create: yes

    - name: Reboot only if rollback changed packages
      reboot:
        msg: "Reboot initiated by Ansible after rollback"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: rollback_result.changed
