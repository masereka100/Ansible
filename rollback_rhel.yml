---
- name: Rollback RHEL system packages to last snapshot
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    - name: Find latest snapshot file
      ansible.builtin.shell: ls -t /var/backups/rpm-packages-*.txt | head -n1
      register: snapshot_file
      changed_when: false

    - name: Fail if no snapshot exists
      ansible.builtin.fail:
        msg: "No package snapshot found under /var/backups"
      when: snapshot_file.stdout == ""

    - name: Filter snapshot to remove gpg-pubkey entries
      ansible.builtin.shell: grep -v '^gpg-pubkey' {{ snapshot_file.stdout }}
      register: filtered_snapshot
      changed_when: false
      when: snapshot_file.stdout != ""

    - name: Restore packages to versions from snapshot
      ansible.builtin.shell: dnf -y install $(echo "{{ filtered_snapshot.stdout }}")
      register: rollback_result
      ignore_errors: yes
      when: snapshot_file.stdout != ""

    - name: Show rollback result
      ansible.builtin.debug:
        var: rollback_result
      when: snapshot_file.stdout != ""

    - name: Log rollback action
      ansible.builtin.lineinfile:
        path: /var/log/ansible-patching.log
        line: "Rollback executed on {{ ansible_date_time.date }} {{ ansible_date_time.time }} using snapshot {{ snapshot_file.stdout }}"
        create: yes
      when: snapshot_file.stdout != ""

    - name: Reboot only if rollback changed packages
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after rollback"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: rollback_result is defined and rollback_result.changed
