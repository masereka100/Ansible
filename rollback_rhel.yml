---
- name: Rollback RHEL system packages to last snapshot
  hosts: all
  become: true
  gather_facts: true

  vars:
    snapshot_dir: /var/log/rpm_snapshots
    log_file: /var/log/ansible-patching.log

  tasks:

    - name: Ensure snapshot directory exists
      ansible.builtin.file:
        path: "{{ snapshot_dir }}"
        state: directory
        mode: '0755'

    - name: Find latest snapshot file
      ansible.builtin.find:
        paths: "{{ snapshot_dir }}"
        patterns: "rpm_snapshot-{{ inventory_hostname }}*.txt"
        age_stamp: mtime
        recurse: no
        file_type: file
      register: snapshot_files

    - name: Fail if no snapshot exists
      ansible.builtin.fail:
        msg: "No RPM snapshot found for {{ inventory_hostname }}"
      when: snapshot_files.matched == 0

    - name: Set snapshot file variable
      ansible.builtin.set_fact:
        snapshot_file: "{{ snapshot_files.files | sort(attribute='mtime') | last | map(attribute='path') | first }}"

    - name: Restore packages to versions from snapshot
      ansible.builtin.shell: |
        xargs -a {{ snapshot_file }} sudo dnf install -y
      register: rollback_result
      ignore_errors: yes

    - name: Log rollback action
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: yes
        line: "{{ ansible_date_time.iso8601 }} - Rollback output on {{ inventory_hostname }}: {{ rollback_result.stdout_lines }}"

    - name: Reboot only if rollback changed packages
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after rollback"
        pre_reboot_delay: 0
        post_reboot_delay: 30
        reboot_timeout: 600
        test_command: whoami
      when: rollback_result is defined and rollback_result.stdout != ""

