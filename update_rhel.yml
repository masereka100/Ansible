
---
- name: Apply security patches excluding kernel updates
  hosts: all
  become: yes
  tasks:

    - name: Show message that patching has started
      ansible.builtin.shell: "echo 'Security patching started at $(date)' >> /var/log/ansible-patching.log"
      changed_when: false

    - name: Apply security updates (exclude kernel)
      ansible.builtin.dnf:
        security: true
        state: latest
        exclude: "kernel*"
      register: update_result

    - name: Show update result
      ansible.builtin.debug:
        var: update_result

    - name: Log update summary on server
      ansible.builtin.shell: "echo 'Security patching completed at $(date)' >> /var/log/ansible-patching.log"
      when: update_result is succeeded
      changed_when: false

    - name: Reboot only if needed
      ansible.builtin.reboot:
        msg: "Rebooting after security patching"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: update_result.changed
