- name: Apply security updates (kernel excluded) with rollback snapshot
  hosts: all
  become: yes
  vars:
    backup_dir: /var/backups

  tasks:

    - name: Ensure backup directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Save RPM snapshot before updates
      command: rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n"
      register: rpm_snapshot

    - name: Write RPM snapshot to file
      copy:
        content: "{{ rpm_snapshot.stdout }}"
        dest: "{{ backup_dir }}/rpm-snapshot-{{ inventory_hostname }}-{{ ansible_date_time.iso8601 }}.txt"
        mode: '0644'

    - name: Apply only security updates (excluding kernel)
      dnf:
        security: yes
        state: latest
        exclude: kernel*
      register: update_result

    - name: Show update result
      debug:
        var: update_result

    - name: Log update summary on server
      lineinfile:
        path: /var/log/ansible-patching.log
        line: "Security patching completed on {{ ansible_date_time.date }} {{ ansible_date_time.time }} (kernel excluded)."
        create: yes

    - name: Reboot only if updates were applied
      reboot:
        msg: "Reboot initiated by Ansible after patching"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: update_result.changed
